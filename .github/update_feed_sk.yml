name: Aggiorna Feed Kaufland Slovakia

on:
  schedule:
    - cron: '0 */8 * * *'  # Every 8 hours
  workflow_dispatch: 

jobs:
  update-feed-sk:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Wait for other workflows to complete
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      
      - name: Esegui sincronizzazione BigBuy Slovakia
        env:
          BIGBUY_API_KEY: ${{ secrets.BIGBUY_API_KEY }}
          COUNTRY_CODE: SK    # ← Changed from DE to SK
        run: python bigbuy_kaufland.py
      
      - name: Check generated files
        run: |
          echo "=== Files generated ==="
          ls -la *.csv *.html *.json 2>/dev/null || echo "No files found"
          echo "=== Slovakia-specific files ==="
          find . -name "*_sk.*" -o -name "kaufland_feed_sk.csv" 2>/dev/null || echo "No SK files found"
          echo "=== File sizes ==="
          if [ -f "kaufland_feed_sk.csv" ]; then
            wc -l kaufland_feed_sk.csv
            echo "✅ Found kaufland_feed_sk.csv with $(wc -l < kaufland_feed_sk.csv) lines"
          fi
          if [ -f "feed_info_sk.json" ]; then
            echo "✅ Found feed_info_sk.json"
          fi
          if [ -f "index_sk.html" ]; then
            echo "✅ Found index_sk.html"
          fi
      
      - name: Commit feed Slovakia
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main --rebase || true
          
          files_to_add=""
          
          if [ -f "kaufland_feed_sk.csv" ]; then
            lines=$(wc -l < kaufland_feed_sk.csv)
            if [ "$lines" -gt 1 ]; then
              files_to_add="$files_to_add kaufland_feed_sk.csv"
              echo "✅ Will commit kaufland_feed_sk.csv with $lines lines"
            else
              echo "❌ kaufland_feed_sk.csv exists but is empty"
              exit 1
            fi
          else
            echo "❌ Missing kaufland_feed_sk.csv"
            exit 1
          fi
          
          if [ -f "index_sk.html" ]; then
            files_to_add="$files_to_add index_sk.html"
            echo "✅ Will commit index_sk.html"
          fi
          
          if [ -f "feed_info_sk.json" ]; then
            files_to_add="$files_to_add feed_info_sk.json"
            echo "✅ Will commit feed_info_sk.json"
          fi
          
          if [ -n "$files_to_add" ]; then
            git add $files_to_add
            echo "📦 Files staged for commit"
            
            if git diff --cached --quiet; then
              echo "ℹ️ Nessuna modifica per la Slovakia"
            else
              product_count=""
              if [ -f "feed_info_sk.json" ]; then
                product_count=$(grep -o '"product_count": [0-9]*' feed_info_sk.json | grep -o '[0-9]*' | head -1)
              fi
              
              commit_msg="🇸🇰 Aggiorna feed Slovakia $(date '+%Y-%m-%d %H:%M')"
              if [ -n "$product_count" ]; then
                commit_msg="$commit_msg - ${product_count} prodotti"
              fi
              
              for i in {1..3}; do
                if git commit -m "$commit_msg"; then
                  if git push; then
                    echo "✅ Feed Slovakia aggiornato con successo!"
                    echo "📡 Feed URL: https://poppulseemporium.github.io/kaufland-feed/kaufland_feed_sk.csv"
                    exit 0
                  else
                    echo "⚠️ Push fallito, tentativo $i/3"
                    if [ $i -lt 3 ]; then
                      git reset HEAD~1
                      git pull origin main --rebase || true
                      git add $files_to_add
                      sleep 5
                    fi
                  fi
                else
                  echo "❌ Commit fallito"
                  exit 1
                fi
              done
              
              echo "❌ Push fallito dopo 3 tentativi"
              exit 1
            fi
          else
            echo "❌ Nessun file Slovakia generato"
            exit 1
          fi
