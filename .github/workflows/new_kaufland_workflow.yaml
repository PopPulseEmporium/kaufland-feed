name: Aggiorna Feed Kaufland Germany NEW

on:
  schedule:
    - cron: '0 */8 * * *'  # Every 8 hours (00:00, 08:00, 16:00 UTC)
  workflow_dispatch: 

jobs:
  update-feed-de:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Wait for other workflows to complete
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      
      - name: Esegui sincronizzazione BigBuy Germany
        env:
          BIGBUY_API_KEY: ${{ secrets.BIGBUY_API_KEY }}
          COUNTRY_CODE: DE
        run: python bigbuy_kaufland.py
      
      - name: Check generated files
        run: |
          echo "=== Separated Feeds Generated ==="
          ls -la *.csv *.html *.json 2>/dev/null || echo "No files found"
          
          echo ""
          echo "=== Product Feed (Manual Upload) ==="
          if [ -f "kaufland_products_de.csv" ]; then
            echo "✅ kaufland_products_de.csv: $(wc -l < kaufland_products_de.csv) lines"
            echo "First line: $(head -1 kaufland_products_de.csv)"
          else
            echo "❌ Missing kaufland_products_de.csv"
          fi
          
          echo ""
          echo "=== Offer Feed (Auto Upload) ==="
          if [ -f "kaufland_offers_de.csv" ]; then
            echo "✅ kaufland_offers_de.csv: $(wc -l < kaufland_offers_de.csv) lines"
            echo "First line: $(head -1 kaufland_offers_de.csv)"
          else
            echo "❌ Missing kaufland_offers_de.csv"
          fi
          
          echo ""
          echo "=== Metadata ==="
          if [ -f "feed_info_de.json" ]; then
            echo "✅ feed_info_de.json exists"
            cat feed_info_de.json | grep -E '"product_count"|"offer_count"|"currency"' || true
          fi
      
      - name: Commit separated feeds Germany
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Pull latest changes
          git pull origin main --rebase || true
          
          # Verify both feed files exist
          files_to_add=""
          errors=""
          
          # Check product feed
          if [ -f "kaufland_products_de.csv" ]; then
            lines=$(wc -l < kaufland_products_de.csv)
            if [ "$lines" -gt 1 ]; then
              files_to_add="$files_to_add kaufland_products_de.csv"
              echo "✅ Product feed ready: $lines lines"
            else
              errors="Product feed empty"
            fi
          else
            errors="Missing product feed"
          fi
          
          # Check offer feed
          if [ -f "kaufland_offers_de.csv" ]; then
            lines=$(wc -l < kaufland_offers_de.csv)
            if [ "$lines" -gt 1 ]; then
              files_to_add="$files_to_add kaufland_offers_de.csv"
              echo "✅ Offer feed ready: $lines lines"
            else
              errors="${errors}, Offer feed empty"
            fi
          else
            errors="${errors}, Missing offer feed"
          fi
          
          # Check optional files
          if [ -f "index_de.html" ]; then
            files_to_add="$files_to_add index_de.html"
            echo "✅ HTML dashboard ready"
          fi
          
          if [ -f "feed_info_de.json" ]; then
            files_to_add="$files_to_add feed_info_de.json"
            echo "✅ Metadata ready"
          fi
          
          # Exit if critical files missing
          if [ -n "$errors" ]; then
            echo "❌ Critical errors: $errors"
            exit 1
          fi
          
          # Add files to staging
          if [ -n "$files_to_add" ]; then
            git add $files_to_add
            echo "📦 Files staged for commit"
            
            # Check if there are changes
            if git diff --cached --quiet; then
              echo "ℹ️ No changes detected"
              exit 0
            fi
            
            # Get stats for commit message
            product_count=""
            offer_count=""
            
            if [ -f "feed_info_de.json" ]; then
              product_count=$(grep -o '"product_count": [0-9]*' feed_info_de.json | grep -o '[0-9]*' | head -1)
              offer_count=$(grep -o '"offer_count": [0-9]*' feed_info_de.json | grep -o '[0-9]*' | head -1)
            fi
            
            # Build commit message
            commit_msg="🇩🇪 Update Germany feeds $(date '+%Y-%m-%d %H:%M')"
            if [ -n "$product_count" ] && [ -n "$offer_count" ]; then
              commit_msg="$commit_msg - ${product_count} products, ${offer_count} offers"
            fi
            
            # Commit and push with retry
            for i in {1..3}; do
              echo "Attempt $i/3: Commit and push..."
              
              if git commit -m "$commit_msg"; then
                if git push; then
                  echo ""
                  echo "=" | tr '\n' '=' | head -c 70; echo ""
                  echo "✅ GERMANY FEEDS UPDATED SUCCESSFULLY!"
                  echo "=" | tr '\n' '=' | head -c 70; echo ""
                  echo ""
                  echo "📦 Product Feed (for manual upload with translations):"
                  echo "   https://poppulseemporium.github.io/kaufland-feed/kaufland_products_de.csv"
                  echo ""
                  echo "💰 Offer Feed (for automatic 3x daily upload - NO translation!):"
                  echo "   https://poppulseemporium.github.io/kaufland-feed/kaufland_offers_de.csv"
                  echo ""
                  echo "🌐 Dashboard:"
                  echo "   https://poppulseemporium.github.io/kaufland-feed/index_de.html"
                  echo ""
                  if [ -n "$product_count" ] && [ -n "$offer_count" ]; then
                    echo "📊 Stats: ${product_count} products, ${offer_count} offers"
                  fi
                  echo ""
                  echo "📋 Next Steps:"
                  echo "   1. Product Feed: Upload manually to Kaufland (rare, when products change)"
                  echo "   2. Offer Feed: Set auto-upload in Kaufland at 02:00, 10:00, 18:00"
                  echo ""
                  exit 0
                else
                  echo "⚠️ Push failed, attempt $i/3"
                  if [ $i -lt 3 ]; then
                    echo "Pulling and retrying..."
                    git reset HEAD~1
                    git pull origin main --rebase || true
                    git add $files_to_add
                    sleep 5
                  fi
                fi
              else
                echo "❌ Commit failed"
                exit 1
              fi
            done
            
            echo "❌ Push failed after 3 attempts"
            exit 1
          else
            echo "❌ No files to commit"
            exit 1
          fi
