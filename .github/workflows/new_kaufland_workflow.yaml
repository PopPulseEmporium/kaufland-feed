name: Update Kaufland Feeds - All Countries

on:
  schedule:
    - cron: '0 */8 * * *'  # Every 8 hours (00:00, 08:00, 16:00 UTC)
  workflow_dispatch: 

jobs:
  update-all-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Wait for other workflows
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      
      - name: Generate multi-language feeds
        env:
          BIGBUY_API_KEY: ${{ secrets.BIGBUY_API_KEY }}
        run: python refactored_kaufland_feed_generator.py
      
      - name: Verify generated files
        run: |
          echo "=" | tr '\n' '=' | head -c 70; echo ""
          echo "MULTI-LANGUAGE FEED GENERATION RESULTS"
          echo "=" | tr '\n' '=' | head -c 70; echo ""
          echo ""
          
          echo "📦 Product Feed (all languages):"
          if [ -f "kaufland_products_all.csv" ]; then
            lines=$(wc -l < kaufland_products_all.csv)
            echo "   ✅ kaufland_products_all.csv: $lines lines"
            echo "   Header: $(head -1 kaufland_products_all.csv | cut -c1-100)..."
          else
            echo "   ❌ Missing kaufland_products_all.csv"
            exit 1
          fi
          
          echo ""
          echo "💰 Offer Feeds (per country):"
          for country in de at sk pl cz; do
            file="kaufland_offers_${country}.csv"
            if [ -f "$file" ]; then
              lines=$(wc -l < "$file")
              echo "   ✅ $file: $lines lines"
            else
              echo "   ❌ Missing $file"
            fi
          done
          
          echo ""
          echo "📋 Metadata:"
          if [ -f "feed_info.json" ]; then
            echo "   ✅ feed_info.json"
            cat feed_info.json | grep -E '"product_count"|"offer_counts"' || true
          fi
      
      - name: Commit and push all feeds
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Pull latest
          git pull origin main --rebase || true
          
          # Collect all files
          files_to_add=""
          
          # Product feed (required)
          if [ -f "kaufland_products_all.csv" ]; then
            files_to_add="$files_to_add kaufland_products_all.csv"
            echo "✅ Will commit product feed"
          else
            echo "❌ Missing product feed"
            exit 1
          fi
          
          # Offer feeds (all countries)
          for country in de at sk pl cz; do
            file="kaufland_offers_${country}.csv"
            if [ -f "$file" ]; then
              files_to_add="$files_to_add $file"
              echo "✅ Will commit $file"
            else
              echo "⚠️ Missing $file (optional)"
            fi
          done
          
          # Metadata
          if [ -f "feed_info.json" ]; then
            files_to_add="$files_to_add feed_info.json"
          fi
          
          # Stage files
          if [ -n "$files_to_add" ]; then
            git add $files_to_add
            
            # Check for changes
            if git diff --cached --quiet; then
              echo "ℹ️ No changes detected"
              exit 0
            fi
            
            # Get stats
            product_count=""
            if [ -f "feed_info.json" ]; then
              product_count=$(grep -o '"product_count": [0-9]*' feed_info.json | grep -o '[0-9]*' | head -1)
            fi
            
            # Build commit message
            commit_msg="🌍 Update all country feeds $(date '+%Y-%m-%d %H:%M')"
            if [ -n "$product_count" ]; then
              commit_msg="$commit_msg - ${product_count} products"
            fi
            
            # Commit and push with retry
            for i in {1..3}; do
              echo "Attempt $i/3..."
              
              if git commit -m "$commit_msg"; then
                if git push; then
                  echo ""
                  echo "=" | tr '\n' '=' | head -c 70; echo ""
                  echo "✅ ALL COUNTRY FEEDS UPDATED SUCCESSFULLY!"
                  echo "=" | tr '\n' '=' | head -c 70; echo ""
                  echo ""
                  echo "📦 PRODUCT FEED (Multi-Language - Manual Upload):"
                  echo "   https://poppulseemporium.github.io/kaufland-feed/kaufland_products_all.csv"
                  echo "   Contains: DE, AT, SK, PL, CZ translations"
                  echo "   Upload: Manually to Kaufland when products change"
                  echo ""
                  echo "💰 OFFER FEEDS (Auto-Upload 3x Daily):"
                  for country in de at sk pl cz; do
                    file="kaufland_offers_${country}.csv"
                    if [ -f "$file" ]; then
                      echo "   🇪🇺 ${country^^}: https://poppulseemporium.github.io/kaufland-feed/$file"
                    fi
                  done
                  echo ""
                  echo "📋 SETUP INSTRUCTIONS:"
                  echo "   1. Upload kaufland_products_all.csv to Kaufland (one-time/rare)"
                  echo "   2. Configure auto-upload for each offer feed:"
                  echo "      - Times: 02:00, 10:00, 18:00 (local time)"
                  echo "      - NO translation needed!"
                  echo ""
                  if [ -n "$product_count" ]; then
                    echo "📊 Products: $product_count with confirmed stock"
                  fi
                  echo ""
                  exit 0
                else
                  echo "⚠️ Push failed, attempt $i/3"
                  if [ $i -lt 3 ]; then
                    git reset HEAD~1
                    git pull origin main --rebase || true
                    git add $files_to_add
                    sleep 5
                  fi
                fi
              else
                echo "❌ Commit failed"
                exit 1
              fi
            done
            
            echo "❌ Push failed after 3 attempts"
            exit 1
          else
            echo "❌ No files to commit"
            exit 1
          fi
