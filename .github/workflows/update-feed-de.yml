name: Aggiorna Feed Kaufland Germany

on:
  schedule:
    - cron: '0 */8 * * *'  # Every 8 hours
  workflow_dispatch: 

jobs:
  update-feed-de:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Wait for other workflows to complete
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      
      - name: Esegui sincronizzazione BigBuy Germany
        env:
          BIGBUY_API_KEY: ${{ secrets.BIGBUY_API_KEY }}
          COUNTRY_CODE: DE
        run: python bigbuy_kaufland.py
      
      - name: Check generated files
        run: |
          echo "=== Files generated ==="
          ls -la *.csv *.html *.json 2>/dev/null || echo "No files found"
          echo "=== Germany-specific files ==="
          find . -name "*_de.*" -o -name "kaufland_feed_de.csv" 2>/dev/null || echo "No DE files found"
          echo "=== File sizes ==="
          if [ -f "kaufland_feed_de.csv" ]; then
            wc -l kaufland_feed_de.csv
            echo "✅ Found kaufland_feed_de.csv with $(wc -l < kaufland_feed_de.csv) lines"
          fi
          if [ -f "feed_info_de.json" ]; then
            echo "✅ Found feed_info_de.json"
          fi
          if [ -f "index_de.html" ]; then
            echo "✅ Found index_de.html"
          fi
      
      - name: Commit feed Germany
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Pull latest changes (no stash needed - files are new/modified)
          git pull origin main --rebase || true
          
          # Verify files exist
          files_to_add=""
          
          if [ -f "kaufland_feed_de.csv" ]; then
            lines=$(wc -l < kaufland_feed_de.csv)
            if [ "$lines" -gt 1 ]; then
              files_to_add="$files_to_add kaufland_feed_de.csv"
              echo "✅ Will commit kaufland_feed_de.csv with $lines lines"
            else
              echo "❌ kaufland_feed_de.csv exists but is empty"
              exit 1
            fi
          else
            echo "❌ Missing kaufland_feed_de.csv"
            exit 1
          fi
          
          if [ -f "index_de.html" ]; then
            files_to_add="$files_to_add index_de.html"
            echo "✅ Will commit index_de.html"
          fi
          
          if [ -f "feed_info_de.json" ]; then
            files_to_add="$files_to_add feed_info_de.json"
            echo "✅ Will commit feed_info_de.json"
          fi
          
          # Add files to staging
          if [ -n "$files_to_add" ]; then
            git add $files_to_add
            echo "📦 Files staged for commit"
            
            # Check if there are actual changes
            if git diff --cached --quiet; then
              echo "ℹ️ Nessuna modifica per la Germany"
            else
              # Get stats for commit message
              product_count=""
              fingerprint=""
              
              if [ -f "feed_info_de.json" ]; then
                product_count=$(grep -o '"product_count": [0-9]*' feed_info_de.json | grep -o '[0-9]*' | head -1)
                fingerprint=$(grep -o '"random_seed": [0-9]*' feed_info_de.json | grep -o '[0-9]*' | head -1)
              fi
              
              # Build commit message
              commit_msg="🇩🇪 Aggiorna feed Germany $(date '+%Y-%m-%d %H:%M')"
              if [ -n "$product_count" ]; then
                commit_msg="$commit_msg - ${product_count} prodotti"
              fi
              if [ -n "$fingerprint" ]; then
                commit_msg="$commit_msg [seed: $fingerprint]"
              fi
              
              # Commit and push with retry
              for i in {1..3}; do
                echo "Tentativo $i/3 di commit e push..."
                
                if git commit -m "$commit_msg"; then
                  if git push; then
                    echo "✅ Feed Germany aggiornato con successo!"
                    echo "📡 Feed URL: https://poppulseemporium.github.io/kaufland-feed/kaufland_feed_de.csv"
                    echo "🌐 HTML page: https://poppulseemporium.github.io/kaufland-feed/index_de.html"
                    if [ -n "$product_count" ]; then
                      echo "📊 Products: $product_count with confirmed stock"
                    fi
                    exit 0
                  else
                    echo "⚠️ Push fallito, tentativo $i/3"
                    if [ $i -lt 3 ]; then
                      echo "Pulling latest changes and retrying..."
                      git reset HEAD~1
                      git pull origin main --rebase || true
                      git add $files_to_add
                      sleep 5
                    fi
                  fi
                else
                  echo "❌ Commit fallito"
                  exit 1
                fi
              done
              
              echo "❌ Push fallito dopo 3 tentativi"
              exit 1
            fi
          else
            echo "❌ Nessun file Germany generato - controllare il log Python"
            exit 1
          fi
