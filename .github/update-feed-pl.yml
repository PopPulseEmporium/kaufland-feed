name: Aggiorna Feed Kaufland Poland

on:
  schedule:
    - cron: '0 */8 * * *'  # Every 8 hours
  workflow_dispatch: 

jobs:
  update-feed-pl:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica codice
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Wait for other workflows to complete
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      
      - name: Esegui sincronizzazione BigBuy Poland
        env:
          BIGBUY_API_KEY: ${{ secrets.BIGBUY_API_KEY }}
          COUNTRY_CODE: PL
        run: python bigbuy_kaufland.py
      
      - name: Check generated files
        run: |
          echo "=== Files generated ==="
          ls -la *.csv *.html *.json 2>/dev/null || echo "No files found"
          if [ -f "kaufland_feed_pl.csv" ]; then
            echo "✅ Found kaufland_feed_pl.csv with $(wc -l < kaufland_feed_pl.csv) lines"
          fi
      
      - name: Commit feed Poland
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main --rebase || true
          
          files_to_add=""
          
          if [ -f "kaufland_feed_pl.csv" ]; then
            files_to_add="$files_to_add kaufland_feed_pl.csv"
          else
            echo "❌ Missing kaufland_feed_pl.csv"
            exit 1
          fi
          
          [ -f "index_pl.html" ] && files_to_add="$files_to_add index_pl.html"
          [ -f "feed_info_pl.json" ] && files_to_add="$files_to_add feed_info_pl.json"
          
          if [ -n "$files_to_add" ]; then
            git add $files_to_add
            
            if ! git diff --cached --quiet; then
              product_count=$(grep -o '"product_count": [0-9]*' feed_info_pl.json 2>/dev/null | grep -o '[0-9]*' | head -1)
              commit_msg="🇵🇱 Aggiorna feed Poland $(date '+%Y-%m-%d %H:%M')"
              [ -n "$product_count" ] && commit_msg="$commit_msg - ${product_count} prodotti"
              
              for i in {1..3}; do
                if git commit -m "$commit_msg" && git push; then
                  echo "✅ Feed Poland aggiornato!"
                  echo "📡 https://poppulseemporium.github.io/kaufland-feed/kaufland_feed_pl.csv"
                  exit 0
                else
                  [ $i -lt 3 ] && sleep 5 && git reset HEAD~1 && git pull origin main --rebase && git add $files_to_add
                fi
              done
              exit 1
            fi
          fi
